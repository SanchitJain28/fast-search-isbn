docRoot /var/www/bookscanner-acme
vhDomain scanner.200.234.32.63.nip.io
enableGzip 1

extprocessor bookscanner_proxy {
  type proxy
  address 127.0.0.1:3000
  maxConns 100
  pcKeepAliveTimeout 60
  initTimeout 300
  retryTimeout 0
  respBuffer 0
}

context /.well-known/acme-challenge/ {
  type static
  location /var/www/bookscanner-acme/.well-known/acme-challenge/
  allowBrowse 1
  addDefaultCharset off
  rewrite {
    enable 0
  }
}

context / {
  type proxy
  handler bookscanner_proxy
  addDefaultCharset off
}

rewrite {
  enable 1
  autoLoadHtaccess 0
  RewriteCond %{HTTPS} !=on
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://scanner.200.234.32.63.nip.io%{REQUEST_URI} [L,R=301]
}

module cache {
  enableCache 0
  enablePrivateCache 0
}
